apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend
          image: minimarketplace-backend:latest
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: app-data
              mountPath: /app/data

      volumes:
        - name: app-data
          persistentVolumeClaim:
            claimName: backend-data