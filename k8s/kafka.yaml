apiVersion: apps/v1
kind: Deployment

metadata:
  name: kafka

spec:
  replicas: 1

  selector:
    matchLabels:
      app: kafka

  template:
    metadata:
      labels:
        app: kafka

    spec:
      containers:
        - name: kafka
          image: apache/kafka:4.1.0
          ports:
            - containerPort: 9093

          envFrom:
            - configMapRef:
                name: kafka-config